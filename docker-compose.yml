version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campushub_postgres
    environment:
      POSTGRES_DB: campushub
      POSTGRES_USER: campushub_user
      POSTGRES_PASSWORD: campushub_pass_123
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushub_user -d campushub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushub_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://campushub_user:campushub_pass_123@postgres:5432/campushub
      JWT_SECRET: super_secret_key_change_me
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushub_frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_APP_NAME: CampusHub
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host

volumes:
  postgres_data:
